{% extends "base.html" %}
{% block content %}
<h1>{{ action }} Contact</h1>
<form method="post" class="col-md-6">
  <div class="mb-3"><label class="form-label">Company *</label>
    <select class="form-select" name="company_id" required>
      <option value="">Choose a company...</option>
      {% for c in companies %}
      <option value="{{ c.company_id }}" {% if contact.company_id|string == c.company_id|string %}selected{% endif %}>{{ c.company_name }}</option>
      {% endfor %}
    </select></div>
  <div class="mb-3"><label class="form-label">Contact name *</label>
    <input class="form-control" name="contact_name" maxlength="100" value="{{ contact.contact_name or '' }}" required></div>
  <div class="mb-3"><label class="form-label">Title</label>
    <input class="form-control" name="title" maxlength="100" value="{{ contact.title or '' }}"></div>
  <div class="row">
    <div class="col mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" maxlength="100" value="{{ contact.email or '' }}"></div>
    <div class="col mb-3"><label class="form-label">Phone</label>
      <input class="form-control" name="phone" maxlength="20" value="{{ contact.phone or '' }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">LinkedIn URL</label>
    <input class="form-control" name="linkedin_url" maxlength="200" value="{{ contact.linkedin_url or '' }}" placeholder="https://www.linkedin.com/in/..."></div>
  <div class="mb-3"><label class="form-label">Notes</label>
    <textarea class="form-control" name="notes" rows="3">{{ contact.notes or '' }}</textarea></div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('contacts') }}">Cancel</a>
</form>
{% endblock %}
