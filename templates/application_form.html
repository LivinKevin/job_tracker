{% extends "base.html" %}
{% block content %}
<h1>{{ action }} Application</h1>
<form method="post" class="col-md-6">
  <div class="mb-3"><label class="form-label">Job *</label>
    <select class="form-select" name="job_id" required>
      <option value="">Choose a job...</option>
      {% for j in jobs %}
      <option value="{{ j.job_id }}" {% if application.job_id|string == j.job_id|string %}selected{% endif %}>{{ j.job_title }} at {{ j.company_name }}</option>
      {% endfor %}
    </select></div>
  <div class="row">
    <div class="col mb-3"><label class="form-label">Application date *</label>
      <input class="form-control" type="date" name="application_date" value="{{ application.application_date or '' }}" required></div>
    <div class="col mb-3"><label class="form-label">Status</label>
      <select class="form-select" name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if application.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select></div>
  </div>
  <div class="mb-3"><label class="form-label">Resume version</label>
    <input class="form-control" name="resume_version" value="{{ application.resume_version or '' }}" placeholder="v2.1"></div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="cover_letter_sent" id="cl" {% if application.cover_letter_sent %}checked{% endif %}>
    <label class="form-check-label" for="cl">Cover letter sent</label></div>
  <div class="mb-3"><label class="form-label">Interview data (optional, JSON)</label>
    <textarea class="form-control font-monospace" name="interview_data" rows="8"
      placeholder='{"interview_rounds": 1, "interviewers": ["Name"], "feedback": "..."}'>{{ interview_text }}</textarea></div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('applications') }}">Cancel</a>
</form>
{% endblock %}
