{% extends "base.html" %}
{% block content %}
<h1>{{ action }} Company</h1>
<form method="post" class="col-md-6">
  <div class="mb-3"><label class="form-label">Company name *</label>
    <input class="form-control" name="company_name" value="{{ company.company_name or '' }}" required></div>
  <div class="mb-3"><label class="form-label">Industry</label>
    <input class="form-control" name="industry" value="{{ company.industry or '' }}"></div>
  <div class="mb-3"><label class="form-label">Website</label>
    <input class="form-control" name="website" value="{{ company.website or '' }}"></div>
  <div class="row">
    <div class="col mb-3"><label class="form-label">City</label>
      <input class="form-control" name="city" value="{{ company.city or '' }}"></div>
    <div class="col mb-3"><label class="form-label">State</label>
      <input class="form-control" name="state" value="{{ company.state or '' }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Notes</label>
    <textarea class="form-control" name="notes" rows="3">{{ company.notes or '' }}</textarea></div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('companies') }}">Cancel</a>
</form>
{% endblock %}
